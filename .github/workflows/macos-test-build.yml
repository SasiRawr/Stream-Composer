name: 'macOS test build'

# Manual only - this does NOT build on every push/PR, and does NOT publish
# a GitHub release. It exists purely so Harvey can grab a real macOS build
# to try locally without needing a Mac to compile on. Trigger it from the
# Actions tab -> "macOS test build" -> "Run workflow".
#
# KNOWN GAP, real and worth knowing before testing: this build excludes the
# Kokoro TTS sidecar entirely (see tauri.macos-ci.conf.json) because only a
# Windows binary exists for it - Tauri's externalBin requires a per-platform
# binary to exist at build time, and building one for macOS needs an actual
# Mac to compile on, which this workflow doesn't attempt. Chatterbox's local
# TTS download will also not work on macOS in its current form - its
# download step hardcodes a Windows embeddable Python distribution
# (`python.exe`), a separate, not-yet-solved gap. Everything else (overlay
# building/baking, Chat+TTS Overlay's browser/Polly voices, PNGTuber,
# pets, Now Playing, etc.) should work normally.
on:
  workflow_dispatch:

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin   # Apple Silicon (M1 and later)
            label: apple-silicon
          - target: x86_64-apple-darwin    # Intel Macs
            label: intel

    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'
          cache-dependency-path: stream-composer/package-lock.json

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: install frontend dependencies
        working-directory: stream-composer
        run: npm install

      # No tagName/releaseId given, so tauri-action only builds - it does
      # not try to upload anywhere or publish a release.
      - name: build (no publish)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: stream-composer
          args: --target ${{ matrix.target }} --config src-tauri/tauri.macos-ci.conf.json

      - name: upload build for download
        uses: actions/upload-artifact@v4
        with:
          name: stream-composer-macos-${{ matrix.label }}
          path: |
            stream-composer/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            stream-composer/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
          if-no-files-found: error
