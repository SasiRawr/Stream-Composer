<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stream-Builder</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<!--
  ============================================================================
  STREAM-BUILDER — MILESTONE 1
  ============================================================================
  This is the real-app replacement for v1-pop-up-slide's editor.html. Same
  job (open a popup-slide campaign, edit it with a form, save it) but with
  one important difference: "Save" here writes straight back to the
  project's own settings.js on disk. No download, no drag-and-drop replace —
  see HANDOFF_FOR_CLAUDE_CODE.md's "browser file-write" section for why that
  used to be impossible from a plain webpage.

  This only understands the v1 popup-slide project shape for now. The
  general Module system described in V2_ARCHITECTURE.md (so this can open
  ANY overlay type, not just popup slides) is the next milestone — this one
  is deliberately scoped to proving "open a folder as a Project, edit it,
  save it for real" end to end first.
  ============================================================================
-->

<h1>Stream-Builder</h1>
<div class="subtitle" id="subtitle">No project open.</div>

<div class="panel">
  <h2>Project</h2>
  <div class="field-row">
    <div class="field">
      <label id="projectPathLabel">No folder selected.</label>
    </div>
  </div>
  <div class="actions">
    <button class="secondary" id="openProjectBtn" type="button">Open Project Folder…</button>
  </div>
</div>

<div class="panel" id="generalPanel" hidden>
  <h2>General</h2>
  <div class="field-row">
    <div class="field">
      <label for="transitionStyle">Text transition style</label>
      <select id="transitionStyle">
        <option value="fade">fade</option>
        <option value="slide">slide</option>
        <option value="slide-up">slide-up</option>
        <option value="slide-down">slide-down</option>
        <option value="zoom">zoom</option>
        <option value="none">none (instant cut)</option>
        <option value="random">random (different every slide)</option>
      </select>
    </div>
  </div>
  <div class="field-row">
    <div class="field">
      <label for="perSlideSeconds">Seconds each slide stays on screen</label>
      <input type="number" id="perSlideSeconds" step="0.1" min="0.5">
    </div>
    <div class="field">
      <label for="pauseSeconds">Seconds paused (blank) before it repeats</label>
      <input type="number" id="pauseSeconds" step="0.1" min="0">
    </div>
  </div>
</div>

<div class="panel" id="slidesPanel" hidden>
  <h2>Slides</h2>
  <div id="slideList"></div>
  <button class="secondary" id="addSlideBtn" type="button">+ Add slide</button>
</div>

<div class="actions" id="mainActions" hidden>
  <button class="primary" id="saveBtn" type="button">Save settings.js</button>
  <button class="secondary" id="previewBtn" type="button">Save &amp; Preview overlay</button>
</div>
<div id="status"></div>

<script type="module" src="/main.js"></script>
</body>
</html>
