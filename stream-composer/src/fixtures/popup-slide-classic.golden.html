<script>

(function () {
  const SLIDES = [{"tag":"WEB","text":"YourSite.com","iconType":"none"},{"tag":"TWITCH","text":"twitch.tv/you","iconType":"svg","iconSvg":"<circle cx=\"12\" cy=\"12\" r=\"11\" fill=\"#9146FF\"/><text x=\"12\" y=\"15.5\" font-size=\"8\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#ffffff\" font-family=\"Arial, sans-serif\">TW</text>"},{"tag":"KEEP","text":"Kept icon","iconType":"svg","iconSvg":"<path d=\"M2 2h20v20H2z\"/>"},{"tag":"PIC","text":"Custom image","iconType":"image","iconSrc":"assets/item-abc123-slide3.png"}];
  const TIMING = {"holdBeforeOpening":350,"textOpenDuration":450,"perMessageHold":2600,"swapFade":260,"holdBeforeSlideOut":400,"slideOutPause":500};
  const TRANSITION_STYLES = {
    'fade': { transform: 'translate(0px, 4px)' },
    'slide': { transform: 'translate(22px, 0px)' },
    'slide-up': { transform: 'translate(0px, 22px)' },
    'slide-down': { transform: 'translate(0px, -22px)' },
    'zoom': { transform: 'scale(0.82)' },
    'none': { transform: 'translate(0px, 0px)', instant: true },
  };
  const RANDOMIZABLE_STYLES = Object.keys(TRANSITION_STYLES);
  const wrap = document.getElementById('popup-itemabc123-0');
  const iconBox = document.getElementById('popup-itemabc123-0-icon');
  const textPanel = document.getElementById('popup-itemabc123-0-panel');
  const textInner = document.getElementById('popup-itemabc123-0-inner');
  const msgTag = document.getElementById('popup-itemabc123-0-tag');
  const msgText = document.getElementById('popup-itemabc123-0-text');
  const root = wrap.style;
  const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

  function applyTransitionStyle() {
    let key = "slide";
    if (key === 'random') key = RANDOMIZABLE_STYLES[Math.floor(Math.random() * RANDOMIZABLE_STYLES.length)];
    const style = TRANSITION_STYLES[key] || TRANSITION_STYLES.fade;
    root.setProperty('--swap-transform', style.transform);
    root.setProperty('--swap-duration', style.instant ? '0s' : '0.3s');
  }

  // One atomic entry point for "show this message" — tag, text, AND icon all
  // update together here, never as separate steps, so they can't desync
  // (see PROJECT_NOTES.md §3.8: the exact bug class this avoids).
  function setMessage(message) {
    applyTransitionStyle();
    msgTag.textContent = message.tag;
    msgText.textContent = message.text;
    if (message.iconType === 'svg') {
      iconBox.innerHTML = '<svg viewBox="0 0 24 24">' + message.iconSvg + '</svg>';
    } else if (message.iconType === 'image') {
      iconBox.innerHTML = '<img src="' + message.iconSrc + '" alt="" style="width:38px;height:38px;border-radius:8px;object-fit:cover;">';
    } else {
      iconBox.innerHTML = '<div style="width:38px;height:38px;border-radius:8px;background:var(--violet);"></div>';
    }
    textPanel.style.maxWidth = textInner.scrollWidth + 46 + 'px';
  }

  // Each run of the loop owns a generation number. Restarting bumps it, and
  // the old run notices at its next wait and quietly stops, so two loops
  // never fight over the same element.
  let generation = 0;
  const STOPPED = {};
  async function wait(ms, gen) {
    await sleep(ms);
    if (gen !== generation) throw STOPPED;
  }

  function resetToHidden() {
    textInner.classList.remove('is-shown');
    textPanel.style.maxWidth = '0px';
    wrap.classList.remove('is-visible');
  }

  async function runCycle(gen) {
    setMessage(SLIDES[0]);
    textPanel.style.maxWidth = '0px';
    wrap.classList.add('is-visible');
    await wait(TIMING.holdBeforeOpening + 700, gen);

    setMessage(SLIDES[0]);
    await wait(50, gen);
    textInner.classList.add('is-shown');
    await wait(TIMING.textOpenDuration + TIMING.perMessageHold, gen);

    for (let i = 1; i < SLIDES.length; i++) {
      textInner.classList.remove('is-shown');
      await wait(TIMING.swapFade, gen);
      setMessage(SLIDES[i]);
      textInner.classList.add('is-shown');
      await wait(TIMING.perMessageHold, gen);
    }

    textInner.classList.remove('is-shown');
    textPanel.style.maxWidth = '0px';
    await wait(TIMING.holdBeforeSlideOut, gen);
    wrap.classList.remove('is-visible');
    await wait(700 + TIMING.slideOutPause, gen);
  }

  async function loopForever(gen) {
    try { while (true) { await runCycle(gen); } }
    catch (e) { if (e !== STOPPED) throw e; }
  }

  function restart() {
    generation++;
    resetToHidden();
    // One frame in the hidden state first, so the slide-in plays from the start
    requestAnimationFrame(() => requestAnimationFrame(() => loopForever(generation)));
  }

  // Turning the source's eye back on in OBS replays from the first slide,
  // instead of carrying on wherever the replay timer happened to be.
  window.addEventListener('obsSourceVisibleChanged', (event) => {
    if (event.detail && event.detail.visible) restart();
    else { generation++; resetToHidden(); }
  });

  loopForever(generation);
})();
</script>
