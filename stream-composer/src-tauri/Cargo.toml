[package]
name = "stream-composer"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "stream_composer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# Used only to download the Kokoro TTS model/voice files on demand (not
# bundled in the installer - see kokoro_download_model in lib.rs for why).
# The blocking client keeps this simple: run it on a spawned blocking
# thread rather than pulling in a streaming/async body-reading dependency
# just for this one feature.
reqwest = { version = "0.13", features = ["blocking"] }
windows = { version = "0.62.2", features = ["Media_Control", "Foundation", "Storage_Streams"] }
tiny_http = "0.12.0"
# "events" feature needed for the OBS live volume-meter relay (InputVolumeMeters
# is a high-volume event, opt-in only) - see lib.rs's OBS LIVE VOLUME METER
# RELAY section for the confirmed API shape. Off by default in obws itself.
obws = { version = "0.15.0", features = ["events"] }
# Only for EventStream::next() (obws's event stream implements
# futures_util::Stream, not a bare iterator) - already an obws/tauri
# transitive dependency, just not previously a direct one.
futures-util = "0.3"
# Only for the volume-meter relay's reconnect backoff sleep - already a
# tauri/obws transitive dependency (tauri's own async runtime IS tokio),
# just not previously a direct one.
tokio = { version = "1", features = ["time"] }
flate2 = "1.1.9"
tar = "0.4.46"

